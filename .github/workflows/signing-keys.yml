name: create signing keys

# One shot: makes whichever signing key is missing and stores it as a
# secret, showing only its public details. CRX_SIGNING_KEY (RSA) signs the
# CRXs and browsers pin its hash; INDEX_SIGNING_KEY (ECDSA P-256) signs the
# feeds' indexes and update servers trust it. Never replaces a key.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keys:
    runs-on: ubuntu-24.04
    env:
      # secrets can't be tested in `if:`, so expose only whether they're set
      HAS_CRX_KEY: ${{ secrets.CRX_SIGNING_KEY != '' }}
      HAS_INDEX_KEY: ${{ secrets.INDEX_SIGNING_KEY != '' }}
      # GITHUB_TOKEN can't write secrets: a fine-grained token with
      # "Secrets: read and write" on this repository
      GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
    steps:
      - name: refuse when both keys exist
        if: env.HAS_CRX_KEY == 'true' && env.HAS_INDEX_KEY == 'true'
        run: |
          echo "::error::both keys exist; delete one first to replace it"
          exit 1

      - name: generate and store the crx key
        if: env.HAS_CRX_KEY != 'true'
        run: |
          umask 077
          key="$RUNNER_TEMP/crx-key.pem"
          trap 'rm -f "$key"' EXIT
          openssl genrsa -out "$key" 2048 2>/dev/null
          gh secret set CRX_SIGNING_KEY --repo "$GITHUB_REPOSITORY" < "$key"
          hash=$(openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -c1-64)
          {
            echo "### CRX signing key"
            echo
            echo "component ID: $(printf %s "$hash" | cut -c1-32 | tr 0-9a-f a-p)"
            echo
            echo "key SHA-256: $hash"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: generate and store the index key
        if: env.HAS_INDEX_KEY != 'true'
        run: |
          umask 077
          key="$RUNNER_TEMP/index-key.pem"
          trap 'rm -f "$key"' EXIT
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$key"
          gh secret set INDEX_SIGNING_KEY --repo "$GITHUB_REPOSITORY" < "$key"
          {
            echo "### Index signing key"
            echo
            echo '```'
            openssl pkey -in "$key" -pubout
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
